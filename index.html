function splitPipes(s){
  if(!s) return [];
  return String(s).split('|||').map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 0; });
}
function parseFaq(s){
  if(!s || s.trim() === PLACEHOLDER) return [];
  var blocks = splitPipes(s);
  var out = [];
  blocks.forEach(function(b){
    var parts = b.split(/A\s*[:：]/);
    if(parts.length < 2) return;
    var qPart = parts[0].replace(/^Q\s*[:：]\s*/, '').trim();
    var aPart = parts.slice(1).join('A:').trim();
    if(qPart && aPart) out.push({ q: qPart, a: aPart });
  });
  return out;
}
function parseLinks(s){
  if(!s) return [];
  var items = splitPipes(s);
  var out = [];
  items.forEach(function(it){
    var idx = it.indexOf('|');
    if(idx < 0) return;
    var label = it.substring(0, idx).trim();
    var url = it.substring(idx + 1).trim();
    if(!url || url === '…' || url.indexOf('http') !== 0) return;
    out.push({ label: label, url: url });
  });
  return out;
}
function parseKeywords(s){
  if(!s) return [];
  return String(s).split(/[,，]/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length > 0; });
}
function parseProcess(s){
  if(!s || s.trim() === PLACEHOLDER) return [];
  return splitPipes(s);
}
function normalizePolicy(s){

  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave", item_title: "연차휴가", keywords: "연차, 휴가, 연차휴가, 반차, 반반차", policy_body: "[연차휴가란?]\n근로기준법 제60조(연차 유급휴가)에 따라 근로자에게 부여되는 유급휴가입니다.\n\n[발생 기준]\nº 입사 당해연도 : 입사일~연말까지 근무실적에 비례하여 발생 \n                     (입사일~연말까지 근무일수 ÷ 소정근로일수 X 15)\nº 입사 차년도 ~ : 15개 + 근속에 따른 가산휴가 발생 \n                     (만 3년 초과 시 매 2년마다 1개 가산, 최대 11개 한도)\n\n[사용 기준]\nº 「연차(8H), 반차+반반차(6H), 반차(4H), 반반차(2H)」 선택하여 사용 가능\n  - 집중휴가 (연속 5일 또는 2+3일 분할 사용) \n  - 공동연차 (연초 그룹웨어 공지)", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n     Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔연차휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(연차휴가-연차, 반차, 2h, 4h, 6h)\n        *1년 미만자는 '연차휴가(1년 미만)'선택\n    ② 신청일자 설정\n    ③ 사용휴가 선택\n        *내역이 보이지 않는 경우 노무지원팀 문의\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "Q : 당일 연차 신청이 가능한가요?\nA : 생산 운영, 업무 등에 차질을 방지하기 위해 최소 1일 전까지 사전신청 해주시기 바랍니다.\n|||\nQ : 발생된 연차를 모두 사용했는데, 초과 사용이 가능한가요?\nA : 연차휴가는 기 발생된 일수에 한하여 사용 가능합니다.\n잔여 연차가 없는 상태에서 불가피하게 휴가가 필요한 경우 '유계결근' 처리가 가능하므로, 사전에 노무지원팀으로 문의해 주시기 바랍니다.\n|||\nQ : 시간단위 휴가(2h, 4h, 6h)는 어떻게 사용하나요?\nA : 출근 또는 퇴근시간을 기준으로만 사용 가능하며, 근무시간 도중 사용은 불가합니다.", related_links: null, sort_order: 1, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-2", item_title: "가족돌봄휴가", keywords: "휴가, 가족돌봄, 가족, 가족돌봄휴가", policy_body: "[가족돌봄휴가란?]\n가족의 질병, 사고, 노령 또는 자녀의 양육을 위하여 사용하는 무급휴가입니다. \n(돌봄대상 : 조부모, 부모, 배우자, 배우자의 부모, 자녀, 손자녀)\n\n[사용 기준]\nº 연 최대 10일 사용 가능(1일 단위 사용 가능)\nº 가족돌봄휴직 기간(최대 90일) 내에 포함하여 사용", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n※ 진단서 등 돌봄필요 증빙서류 사전제출이 어려울 경우, 사후제출 가능 \n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔가족돌봄휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(가족돌봄휴가)\n    ② 신청일자 설정\n    ③ 첨부파일 : 가족관계증명서, 돌봄필요 증빙서류\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "작성 예정", related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/reduced_hours_family_care.jsp", sort_order: 2, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-3", item_title: "하계휴가", keywords: "휴가, 여름휴가, 하계휴가, 여름", policy_body: "[하계휴가란?]\n사내 규정에 따라, 여름철 근로자의 피로 회복과 충전을 위해 부여되는 유급휴가입니다.\n\n[발생 기준]\nº 하계휴가 이전 입사자의 경우 5일 발생 (하계휴가 이후 입사자 미발생)\n\n[사용 기준]\nº 공장 하계휴가 일정에 맞게 사용 \nº 하계휴가기간 업무일정이 있는 경우 하기휴가 사용일정 조정 가능\n  - 부서별 출근인원 / 일정 / 사유 / 대체휴가일정 작성 후 업무협조전 회신\n  - 대체사용기간 : 7월~8월 내 (부득이 한 경우, 일정 조율 가능)\n  - 대체사용 : 연속사용이 원칙이며 업무상 부득이한 경우 1회 분할 가능", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n※ 공장 하계휴가 기간 내 휴가사용 시 별도 신청 불필요\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔하계휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(하계휴가)\n    ② 신청일자 설정\n    ③ 사용휴가 선택\n        *내역이 보이지 않는 경우 노무지원팀 문의\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "작성 예정", related_links: null, sort_order: 3, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-4", item_title: "장기근속휴가", keywords: "휴가, 근속, 장기근속", policy_body: "[장기근속휴가란?]\n장기 근속자에게 부여되는 유급휴가입니다.\n\n[발생 기준]\nº 근속기간에 따라 차등 부여(창립기념일 기준 산정)\n  - 10년 : 5일\n  - 20년 : 10일\n  - 30년 : 15일\n\n[사용 기준]\nº 발생 이후 근속기간 동안 자유롭게 사용 가능", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔장기근속휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(장기근속휴가)\n    ② 신청일자 설정\n    ③ 사용휴가 선택\n        *내역이 보이지 않는 경우 노무지원팀 문의\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "작성 예정", related_links: null, sort_order: 4, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-5", item_title: "정년휴가", keywords: "휴가, 정년, 정년휴가", policy_body: "[정년휴가란?]\n정년 퇴직자에게 부여되는 유급휴가입니다.\n\n[발생 기준]\nº 당해년도 정년퇴직자 대상 10일 발생\n\n[사용 기준]\nº 퇴직 당해년도 연중 자유롭게 사용 가능", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔정년휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(정년휴가)\n    ② 신청일자 설정\n    ③ 사용휴가 선택\n        *내역이 보이지 않는 경우 노무지원팀 문의\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "작성 예정", related_links: null, sort_order: 5, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-6", item_title: "경조휴가", keywords: "휴가, 경조, 경조휴가", policy_body: "[경조휴가란?]\n임직원 분들의 경조사를 지원하기 위한 복리후생 제도입니다.\n\n[지원 범위] (파견직 제외)\nº 경사\n  - 본인 결혼 : 5일\n  - 자녀 결혼 : 1일\n  - 형제자매 결혼 : 1일\nº 조사\n  - 배우자·본인 및 배우자 부모 사망 : 5일\n  - 자녀·형제자매·조부모 사망 : 3일\n  - 백숙부모 사망 : 1일\n\n[사용 기준]\nº 경조일 포함 연속 사용이 원칙\nº 부득이한 사유로 분할·이월 사용 시 사전 승인 필요", process_steps: "HRIS 경조금 지급신청 → 승인 → 휴가 사용\n※ 경조일 시점 사용 : 경조금신청서 승인 후 자동처리\n※ 경조일자 외 사용 : HRIS 근태신청 별도 진행\n\n[HRIS 경조금 지급신청]\nº 신청경로\n  - PC : 〔경조금관리〕 → 〔경조금신청〕\n  - Mobile : 〔경조금신청〕\n\nº 신청방법\n  ① 경조 구분 선택\n  ② 경조일자 설정\n  ③ 첨부서류 : 청첩장·부고·가족관계증명서 등\n  ④ 결재선 설정\n     (결재) 반장 → 팀장", faq: "작성 예정", related_links: null, sort_order: 6, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-7", item_title: "든든아빠휴가 (배우자 출산휴가)", keywords: "휴가, 배우자출산휴가, 배우자, 출산,아빠", policy_body: "[든든아빠휴가(배우자출산휴가)란?]\n배우자 출산 후 남성직원이 가족과 소중한 시간을 함께 보낼 수 있도록 부여되는 유급휴가입니다.\n\n[발생 기준]\nº 배우자가 출산을 한 남성직원 대상 20일 발생\n\n[사용 기준]\nº 출산일로부터 180일 내 사용완료 \nº 최대 3회 분할 사용 가능", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔든든아빠휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(든든아빠휴가)\n    ② 신청일자 설정\n    ③ 첨부파일 : 출생증명서 또는 출산일/예정일을 증명할 수 있는 서류 \n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: "작성 예정", related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/paternity_leave.jsp", sort_order: 7, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-8", item_title: "출산전후휴가", keywords: "휴가, 출산, 산전후 휴가", policy_body: "[출산전후휴가란?]\n임신한 여성 직원의 출산 전·후 보호를 위한 휴가입니다\n\n[발생 기준]\nº 단태아 90일 / 다태아 120일 사용가능\n\n[사용 기준]\nº 출산 후 45일(다태아 60일) 이상 확보되도록 사용\nº 유급 60일 / 이후 무급 (고용보험 급여 지급)", process_steps: "신청서 제출(서면양식) → 승인 → 휴가 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴가 신청]\nº 신청방법\n  -. 신청 시 제출서류 : 신청서(서면양식) + 임신확인서·출산예정증명\n  -. 결재 : (결재) 생산부/실 장 결재(부문장 보고) 후 노무지원팀 전달\n  -. 복직 시 제출서류 : 복직원(서면양식)", faq: "작성 예정", related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/maternity_benefits.jsp", sort_order: 8, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-9", item_title: "유산·사산휴가", keywords: "휴가, 모성보호, 유산, 사산, 유사산휴가", policy_body: "[유산·사산휴가란?]\n유산 또는 사산한 직원의 회복을 위한 휴가입니다. \n\n[발생 기준]\nº 임신기간에 따라 차등 부여\n  -15주 이내: 10일\n  -16~21주: 30일\n  -22~27주: 60일\n  -28주 이상: 90일\n\n[사용 기준]\nº 유·사산일로부터 연속 사용 원칙", process_steps: "신청서 제출(서면양식) → 승인 → 휴가 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴가 신청]\nº 신청방법\n  -. 신청 시 제출서류 : 신청서(서면양식) + 진단서·소견서 등\n  -. 결재 : (결재) 생산부/실 장 결재(부문장 보고) 후 노무지원팀 전달\n  -. 복직 시 제출서류 : 복직원(서면양식)", faq: "작성 예정", related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/miscarriage_stillbirth_leave.jsp", sort_order: 9, layout_type: "multi", single_content: null },
  { category_id: "leave", category_name: "휴가", category_icon: "🏖️", category_desc: " 연차, 가족돌봄, 출산휴가 등 사유별 휴가 안내", item_id: "leave-10", item_title: "태아검진휴가", keywords: "휴가, 모성보호, 태아검진, 검진", policy_body: "[태아검진휴가란?]\n임직원 본인 태아검진을 위한 유급휴가입니다.\n\n[발생 기준]\nº 임신 임직원 본인 대상 임신 주수에 따른 발생\n  - 28주까지: 4주마다 1회\n  - 29~36주: 2주마다 1회\n  - 37주 이후: 1주마다 1회\n\n[사용 기준]\nº 실제 검진일 기준 사용", process_steps: "HRIS 근태신청 → 승인 → 휴가 사용\n\n[HRIS 신청]\nº 신청경로\n  - PC : 〔근태관리〕 → 〔근태신청〕 → 〔근태신청〕\n  - Mobile : 〔휴가/근태신청〕 → 〔근태신청〕 → 〔태아검진휴가〕\n\nº 신청방법 \n  - 신청서 작성\n    ① 근태 선택(태아검진휴가)\n    ② 신청일자 설정\n    ③ 첨부파일 : 진료·검진확인서\n    ④ 결재선 설정\n        (결재) 반장 → 팀장", faq: null, related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/prenatal_checkup_leave.jsp", sort_order: 10, layout_type: "multi", single_content: null },
  { category_id: "LOA", category_name: "휴직", category_icon: "🏠", category_desc: "육아·업무외 상병 등 사유별 휴직 안내", item_id: "LOA", item_title: "육아휴직", keywords: "휴직, 모성보호, 육아, 육아휴직", policy_body: "[육아휴직이란?]\n임신 중인 직원 또는 만 8세 이하(또는 초등학교 2학년 이하) 자녀를 양육하는 직원이 사용하는 무급휴직입니다\n\n[발생 기준]\nº (법정)자녀 1명당 1년 (단, 부모가 각각 3개월 이상 육아휴직을 사용하거나 한부모가족 또는 중증 장애아동 양육 시 최대 1년 6개월 사용 가능)\nº (회사)자녀 1명당 추가 1년 ('24년 이전 출생 자녀는 6개월\n  ※ 6개월 미만 재직자/계약직/파견직 제외)\n\n[사용 기준]\nº 최대 3회 분할 사용 가능하며 1회 사용 시 최소 30일 이상 사용\n\n[급여 기준]\nº 무급\nº 근로복지공단에 육아휴직 급여 신청 가능\n  -. 고용보험 지급기준에 따른 상한액·하한액 적용", process_steps: "휴직원 제출(서면양식) → 승인 → 휴직 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴·복직 신청]\nº 신청방법\n  -. 휴직 시 제출서류 : 휴직원(서면양식) + 등본/가족관계증명서\n     ※ 육아휴직 대상 자녀 표기必\n  -. 결재 : (결재) 생산부/실 장 결재(부문장 보고) 후 노무지원팀 전달\n  - 복직 시 제출서류 : 복직원(서면양식), 결재 상동", faq: "Q : 육아휴직확인서 등록은 어떻게 진행되나요?\nA : 담당 노무지원팀에 문의 예정\n|||\nQ : 4대보험은 어떻게 처리되나요?\nA: 담당 노무지원팀에 문의 예정", related_links: "고용노동부|https://www.worklife.kr/website_renew/index/workerSupport/parental_leave_benefits.jsp", sort_order: 1, layout_type: "multi", single_content: null },
  { category_id: "LOA", category_name: "휴직", category_icon: "🏠", category_desc: "육아·업무외 상병 등 사유별 휴직 안내", item_id: "LOA-2", item_title: "업무 외 상병휴직", keywords: "휴직, 병가, 병가휴직, 업무 외 상병, 상병", policy_body: "[업무 외 상병휴직이란?]\n건강 상 사유로 1주일 이상 요양이 필요한 경우 사용하는 휴직입니다. \n\n[사용 기준]\nº 최대 6개월 까지 사용 가능하며, 진단서 상 요양 필요기간을 기준으로 기간산정\n\n[급여 기준]\nº 통상임금의 70% 지급\n  ※ 단, 본인 과실 · 제3자 가해 · 풍속에 반하는 경우 등은 무급(ex.교통사고 등)", process_steps: "휴직원 제출(서면양식) → 승인 → 휴직 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴·복직 신청]\nº 신청방법\n  -. 휴직 시 제출서류 : 휴직원(서면양식) + 진단서\n     ※ 진단서 상 휴직기간을 판단할 수 있는 일자 명시必\n  -. 결재 : (결재) 생산부/실 장 결재(부문장 보고) 후 노무지원팀 전달\n  - 복직 시 제출서류 : 복직원(서면양식) + 진단서\n     ※ 진단서 상 업무가 가능한 상태를 확인할 수 있는 문구 및 구체적인 일자 명시必\n  -. 결재 : 휴직원과 동일", faq: "작성 예정", related_links: null, sort_order: 2, layout_type: "multi", single_content: null },
  { category_id: "LOA", category_name: "휴직", category_icon: "🏠", category_desc: "육아·업무외 상병 등 사유별 휴직 안내", item_id: "LOA-3", item_title: "가족돌봄휴직", keywords: "휴직, 가족돌봄, 가족", policy_body: "[가족돌봄휴직이란?]\n가족의 질병, 사고, 노령 또는 자녀의 양육을 위하여 사용하는 무급휴직입니다. \n(돌봄대상 : 조부모, 부모, 배우자, 배우자의 부모, 자녀, 손자녀)\n\n[사용 기준]\nº 연 최대 90일 사용 가능(1일 단위 사용 가능)\nº 1회 최소 30일 이상 사용", process_steps: "휴직원 제출(서면양식) → 승인 → 휴직 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴·복직 신청]\nº 신청방법\n  -. 휴직 시 제출서류 : 휴직원(서면양식) + 가족관계증명서 + 돌봄필요 증빙서류\n  -. 결재 : (결재) 생산부/실 장 결재(부문장 보고) 후 노무지원팀 전달\n  -. 복직 시 제출서류 : 복직원(서면양식)", faq: "작성 예정", related_links: null, sort_order: 3, layout_type: "multi", single_content: null },
  { category_id: "LOA", category_name: "휴직", category_icon: "🏠", category_desc: "육아·업무외 상병 등 사유별 휴직 안내", item_id: "LOA-4", item_title: "기타휴직", keywords: "휴직", policy_body: "[기타휴직이란?]\n일신상의 사유로 계속 1개월 이상 결근이 불가피할 때 또는 기타 사유로 대표이사 승인 하 사용하는 무급휴직입니다.\n\n[사용 기준]\nº 최대 3개월 까지 사용 가능", process_steps: "휴직원 제출(서면양식) → 승인 → 휴직 → 복직원 제출(서면양식)  → 승인 → 복직\n\n[휴·복직 신청]\nº 신청방법\n  -. 휴직 시 제출서류 : 휴직원(서면양식) + 휴직 필요 사유/기간을 확인할 수 있는 서류\n  -. 결재 : (결재) 대표이사 결재 후 노무지원팀 전달\n  -. 복직 시 제출서류 : 복직원(서면양식)", faq: "작성 예정", related_links: null, sort_order: 4, layout_type: "multi", single_content: null },

function loadData(){
  DATA = RAW_DATA.map(function(r){
    return {
      categoryId: r.category_id,
      categoryName: r.category_name,
      categoryIcon: r.category_icon,
      categorySub: r.category_desc,
      id: r.item_id,
      title: r.item_title,
      keywords: parseKeywords(r.keywords),
      layoutType: r.layout_type || 'multi',
      singleContent: r.single_content || '',
      policy: normalizePolicy(r.policy_body),
      process: parseProcess(r.process_steps),
      faqs: parseFaq(r.faq),
      links: parseLinks(r.related_links)
    };
  });
  renderList(DATA);
}

function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function highlightBrackets(escapedHtml){
  if(!escapedHtml) return '';
  return escapedHtml.replace(/\[([^\]\n]+)\]/g, '<span class="bracket">[$1]</span>');
}
function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function groupByCat(items){ var map = {}, order = []; items.forEach(function(it){ if(!map[it.categoryId]){ map[it.categoryId] = { id: it.categoryId, name: it.categoryName, icon: it.categoryIcon, sub: it.categorySub, items: [] }; order.push(it.categoryId); } map[it.categoryId].items.push(it); }); return order.map(function(k){ return map[k]; }); }
function renderList(items){
  var wrap = document.getElementById('cat-list');
  var count = document.getElementById('list-count');
  wrap.innerHTML = '';
  var groups = groupByCat(items);
  count.textContent = groups.length + ' CAT · ' + items.length + ' ITEM';
  groups.forEach(function(g){
    var card = document.createElement('div'); card.className = 'cat-card';
    var lis = g.items.map(function(it){ return '<li data-id="'+esc(it.id)+'"><span class="bul"></span><span class="txt">'+esc(it.title)+'</span><span class="arrow">→</span></li>'; }).join('');
    card.innerHTML = '<div class="cat-head"><div class="cat-icon">'+esc(g.icon||'📄')+'</div><div class="cat-title"><h3>'+esc(g.name)+'</h3><div class="sub">'+esc(g.sub||'')+'</div></div><div class="cat-count">'+g.items.length+'건</div></div><ul class="sub-list">'+lis+'</ul>';
    card.querySelectorAll('.sub-list li').forEach(function(li){ li.addEventListener('click', function(){ openDetail(li.getAttribute('data-id')); }); });
    wrap.appendChild(card);
  });
}

// 뷰 상태 관리 — 모바일 뒤로가기 시 페이지를 벗어나지 않고 목록으로 돌아오도록 history API 사용
var currentView = 'list';

function showList(){
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  currentView = 'list';
}

function renderDetail(id){
  var it = DATA.filter(function(x){ return x.id===id; })[0]; if(!it) return false;
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail').style.display = 'block'; window.scrollTo(0,0);
  currentView = 'detail';
  document.getElementById('back-cat').textContent = it.categoryName.toUpperCase();
  document.getElementById('d-crumb').textContent = it.categoryName;
  document.getElementById('d-title').textContent = it.title;
  document.getElementById('d-kw').innerHTML = (it.keywords||[]).map(function(k){ return '<span class="k"># '+esc(k)+'</span>'; }).join('');
  var acc = document.getElementById('acc'); var html = '';
  var emptyMsg = '<div style="padding:6px 4px;font-size:12.5px;color:var(--ink-mute);">작성 예정입니다.</div>';

  // Single-tab layout (HR돋보기 · 세부내용)
  if (it.layoutType === 'single') {
    var singleBody = (it.singleContent && it.singleContent.length) ? '<div class="rule-text">'+highlightBrackets(esc(it.singleContent))+'</div>' : emptyMsg;
    html += '<div class="sec s-policy open"><div class="sec-head"><div class="sec-badge emoji">📖</div><div class="sec-title">세부내용<small>DETAILS</small></div><div class="sec-chev">▼</div></div><div class="sec-body">'+singleBody+'</div></div>';
    acc.innerHTML = html;
    acc.querySelectorAll('.sec-head').forEach(function(h){ h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); }); });
    return true;
  }

  // Multi-tab layout: 01 사내규정 / 02 프로세스 / 03 FAQ / 04 관련링크
  var policyBody = (it.policy && it.policy.length) ? '<div class="rule-text">'+highlightBrackets(esc(it.policy))+'</div>' : emptyMsg;
  html += '<div class="sec s-policy open"><div class="sec-head"><div class="sec-badge">01</div><div class="sec-title">사내규정<small>POLICY</small></div><div class="sec-chev">▼</div></div><div class="sec-body">'+policyBody+'</div></div>';

  var processBody = emptyMsg;
  var procArr = (it.process || []).slice();
  if (procArr.length > 0) {
    var firstBlock = procArr[0];
    var lines = firstBlock.split('\n');
    var startIdx = 0;
    while (startIdx < lines.length && lines[startIdx].trim().length === 0) startIdx++;
    var paraLines = [];
    var i = startIdx;
    while (i < lines.length && lines[i].trim().length > 0) {
      paraLines.push(lines[i]);
      i++;
    }
    var headline = paraLines.join('\n').replace(/\s+$/, '');
    var rest = lines.slice(i).join('\n').replace(/^\n+/, '');
    if (rest.length > 0) { procArr[0] = rest; } else { procArr.shift(); }
    var pillHtml = '';
    if (headline) {
      var pretty = highlightBrackets(esc(headline)).replace(/(\s*→\s*|\s*&gt;\s*)/g, '<span class="arrow">→</span>');
      pillHtml = '<div class="process-pill">'+pretty+'</div>';
    }
    var stepsHtml = procArr.map(function(s){ return '<li>'+highlightBrackets(esc(s))+'</li>'; }).join('');
    var stepsBlock = stepsHtml ? '<ul class="steps">'+stepsHtml+'</ul>' : '';
    if (pillHtml || stepsBlock) processBody = pillHtml + stepsBlock;
  }
  html += '<div class="sec s-process open"><div class="sec-head"><div class="sec-badge">02</div><div class="sec-title">신청 프로세스<small>PROCESS</small></div><div class="sec-chev">▼</div></div><div class="sec-body">'+processBody+'</div></div>';

  var faqHtml = (it.faqs||[]).map(function(f){ return '<div class="faq-item"><div class="faq-q">'+highlightBrackets(esc(f.q))+'</div><div class="faq-a">'+highlightBrackets(esc(f.a))+'</div></div>'; }).join('');
  var faqBody = faqHtml || emptyMsg;
  html += '<div class="sec s-faq open"><div class="sec-head"><div class="sec-badge">03</div><div class="sec-title">자주 묻는 질문<small>FAQ</small></div><div class="sec-chev">▼</div></div><div class="sec-body">'+faqBody+'</div></div>';

  var linkHtml = (it.links||[]).map(function(l){ return '<a class="link-item" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span class="li-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span><div class="li-text"><div class="l1">'+esc(l.label)+'</div><div class="l2">'+esc(domain(l.url))+'</div></div><span class="li-arrow">↗</span></a>'; }).join('');
  var linkBody = linkHtml ? '<div class="link-list">'+linkHtml+'</div>' : emptyMsg;
  html += '<div class="sec s-link open"><div class="sec-head"><div class="sec-badge">04</div><div class="sec-title">관련 정보<small>RESOURCES</small></div><div class="sec-chev">▼</div></div><div class="sec-body">'+linkBody+'</div></div>';
  acc.innerHTML = html;
  acc.querySelectorAll('.sec-head').forEach(function(h){ h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); }); });
  return true;
}

// 상세 열기 — history 스택에 detail 상태를 push해서 모바일 뒤로가기로 목록 복귀
function openDetail(id){
  var ok = renderDetail(id);
  if (!ok) return;
  if (history.state && history.state.view === 'detail') {
    history.replaceState({ view: 'detail', id: id }, '', '#'+encodeURIComponent(id));
  } else {
    history.pushState({ view: 'detail', id: id }, '', '#'+encodeURIComponent(id));
  }
}

// popstate — 브라우저/모바일 뒤로가기 감지 → 목록 화면으로 복귀
window.addEventListener('popstate', function(e){
  var st = e.state;
  if (!st || st.view === 'list') {
    showList();
  } else if (st.view === 'detail' && st.id) {
    renderDetail(st.id);
  }
});

// '뒤로' 버튼 — history.back() 호출로 popstate 이벤트를 트리거해 자연스러운 복귀
document.getElementById('back').addEventListener('click', function(){
  if (history.state && history.state.view === 'detail') {
    history.back();
  } else {
    showList();
  }
});

var qInput = document.getElementById('q');
var qClear = document.getElementById('clear');
function applyFilter(){
  var q = (qInput.value||'').trim().toLowerCase();
  qClear.classList.toggle('on', q.length > 0);
  if(!q){ renderList(DATA); return; }
  var filtered = DATA.filter(function(it){
    if((it.title||'').toLowerCase().indexOf(q) >= 0) return true;
    if((it.categoryName||'').toLowerCase().indexOf(q) >= 0) return true;
    if((it.keywords||[]).some(function(k){ return k.toLowerCase().indexOf(q) >= 0; })) return true;
    return false;
  });
  renderList(filtered);
}
qInput.addEventListener('input', applyFilter);
qClear.addEventListener('click', function(){ qInput.value=''; applyFilter(); qInput.focus(); });

// 초기 history 상태를 'list'로 설정 — 첫 pushState 후 뒤로가기 시 페이지를 벗어나지 않고 여기로 돌아옴
if (!history.state) {
  history.replaceState({ view: 'list' }, '', location.pathname + location.search);
}

loadData();

// URL에 #항목ID 해시가 있으면 해당 상세를 자동으로 열기 (딥링크 지원)
setTimeout(function(){
  var hash = location.hash.replace('#','');
  if (hash) {
    try { hash = decodeURIComponent(hash); } catch(e) {}
    if (DATA.some(function(x){ return x.id === hash; })) {
      openDetail(hash);
    }
  }
}, 0);
</script>
